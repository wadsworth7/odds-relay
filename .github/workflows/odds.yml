name: odds
on:
  schedule:
    - cron: '7 14-23,0-5 * * *'
  workflow_dispatch:
    inputs:
      alts:
        description: 'also fetch alternate ladders (NFL + NBA)'
        type: boolean
        default: true
permissions:
  contents: write
concurrency:
  group: odds
jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch odds
        env:
          ODDS_KEY: ${{ secrets.ODDS_API_KEY }}
          ALTS: ${{ github.event_name == 'workflow_dispatch' && inputs.alts || false }}
        run: |
          set -uo pipefail
          BOOKS="pinnacle,lowvig,betonlineag,bovada,draftkings,fanduel,betmgm,betrivers"
          SPORTS="americanfootball_nfl americanfootball_ncaaf basketball_nba basketball_ncaab icehockey_nhl soccer_uefa_nations_league"
          ALT_SPORTS="americanfootball_nfl basketball_nba"
          mkdir -p boards
          REM="?"
          for S in $SPORTS; do
            H=$(mktemp)
            curl -sS -D "$H" -o "boards/$S.json" \
              "https://api.the-odds-api.com/v4/sports/$S/odds/?apiKey=$ODDS_KEY&bookmakers=$BOOKS&markets=h2h,spreads,totals&oddsFormat=decimal&dateFormat=iso"
            SZ=$(wc -c < "boards/$S.json")
            if [ "$SZ" -lt 20 ]; then echo "empty $S"; rm -f "boards/$S.json" "$H"; continue; fi
            if [ "$SZ" -lt 200 ]; then echo "FAIL  $S $(cat boards/$S.json)"; rm -f "boards/$S.json" "$H"; continue; fi
            N=$(grep -o '"id":"[a-f0-9]\{32\}"' "boards/$S.json" | sort -u | wc -l | tr -d ' ')
            REM=$(grep -i '^x-requests-remaining' "$H" | tr -d '\r' | cut -d' ' -f2-)
            rm -f "$H"
            echo "ok    $S  $N games  rem:$REM"
            case " $ALT_SPORTS " in *" $S "*) ;; *) continue ;; esac
            if [ "$ALTS" != "true" ]; then continue; fi
            AD="boards/${S}_alt"; mkdir -p "$AD"
            grep -o '"id":"[a-f0-9]\{32\}"' "boards/$S.json" | cut -d'"' -f4 | sort -u > ids.txt
            i=0
            while read -r ID; do
              [ -n "$ID" ] || continue
              curl -sS -o "$AD/$ID.json" \
                "https://api.the-odds-api.com/v4/sports/$S/events/$ID/odds/?apiKey=$ODDS_KEY&bookmakers=$BOOKS&markets=alternate_spreads,alternate_totals&oddsFormat=decimal&dateFormat=iso" &
              i=$((i+1))
              if [ $((i % 8)) -eq 0 ]; then wait; fi
            done < ids.txt
            wait
            rm -f ids.txt
            echo "      alts: $(ls "$AD" | wc -l | tr -d ' ')"
          done
          date -u +%FT%TZ > boards/updated.txt
          echo "$REM" > boards/credits.txt
      - name: commit
        run: |
          git config user.name "odds-bot"
          git config user.email "odds-bot@users.noreply.github.com"
          git add -A boards
          git diff --staged --quiet || git commit -m "odds $(date -u +%FT%TZ)"
          git push
